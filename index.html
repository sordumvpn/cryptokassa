<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Kassa</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-sizing: border-box;
    }

    .header {
      text-align: center;
      margin-top: 10px;
    }

    .balance-title {
      color: #8e8e93;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .total-balance {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .actions {
      display: flex;
      justify-content: space-around;
      margin-bottom: 30px;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #007aff;
      font-size: 13px;
      cursor: pointer;
    }

    .action-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #1c1c1e;
      padding: 24px;
      border-radius: 16px;
      width: 85%;
      max-width: 340px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #8e8e93;
      margin-bottom: 5px;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #3a3a3c;
      box-sizing: border-box;
      font-size: 15px;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancel {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      background: #3a3a3c;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    .btn-submit {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      background: #007aff;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="balance-title">Общий баланс в USD</div>
      <div class="total-balance" id="total-balance">$0.00</div>
    </div>

    <div class="actions">
      <button class="action-btn" onclick="openWithdrawModal()">
        <div class="action-icon">📤</div>
        <span>Перевод</span>
      </button>
    </div>
  </div>

  <!-- Модальное окно вывода средств -->
  <div class="modal" id="withdraw-modal">
    <div class="modal-content">
      <h3 style="margin-top:0; margin-bottom:15px;">Вывод криптовалюты</h3>
      
      <div class="input-group">
        <label>Монета:</label>
        <select id="withdraw-coin">
          <option value="USDT">USDT</option>
          <option value="TON">TON</option>
          <option value="BTC">BTC</option>
        </select>
      </div>

      <div class="input-group">
        <label>Адрес получателя:</label>
        <input type="text" id="withdraw-address" placeholder="Введите адрес кошелька...">
      </div>

      <div class="input-group">
        <label>Сумма:</label>
        <input type="number" id="withdraw-amount" placeholder="0.00" step="any">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeWithdrawModal()">Отмена</button>
        <button class="btn-submit" onclick="submitWithdraw()">Отправить</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Укажи текущий URL ngrok
    const API_URL = "https://defiant-clothes-mandarin.ngrok-free.dev";

    async function loadData() {
      try {
        const res = await fetch(`${API_URL}/api/me`, {
          headers: {
            'X-Init-Data': tg.initData || '',
            'ngrok-skip-browser-warning': 'true'
          }
        });
        const data = await res.json();
        if (data.total_usd !== undefined) {
          document.getElementById('total-balance').innerText = `$ ${data.total_usd.toFixed(2)}`;
        }
      } catch (e) {
        console.error("Ошибка загрузки данных:", e);
      }
    }

    function openWithdrawModal() {
      document.getElementById('withdraw-modal').style.display = 'flex';
    }

    function closeWithdrawModal() {
      document.getElementById('withdraw-modal').style.display = 'none';
    }

    async function submitWithdraw() {
      const coin = document.getElementById('withdraw-coin').value;
      const address = document.getElementById('withdraw-address').value.trim();
      const amount = parseFloat(document.getElementById('withdraw-amount').value);

      if (!address) {
        alert("Введите адрес получателя!");
        return;
      }
      if (!amount || amount <= 0) {
        alert("Введите корректную сумму!");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/withdraw`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Init-Data': tg.initData || '',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({ coin, address, amount })
        });

        const data = await res.json();
        if (!res.ok) {
          alert("Ошибка: " + (data.detail || "Не удалось совершить перевод"));
          return;
        }

        alert(`Перевод успешный! Отправлено ${amount} ${coin}`);
        closeWithdrawModal();
        loadData();
      } catch (e) {
        alert("Ошибка подключения к серверу: " + e.message);
      }
    }

    loadData();
  </script>
</body>
</html>
